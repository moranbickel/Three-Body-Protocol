<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 480" role="img" aria-labelledby="tb-title tb-desc">
  <title id="tb-title">The three-body architecture and the bridge</title>
  <desc id="tb-desc">Three actors arranged in a triangle: a strategic AI (top-left), an implementing AI (top-right), and the human operator (bottom-center). The two AIs do not share memory with each other (shown as a dashed line). Both AIs share state only with the human, who is the only persistent actor. In the center sits the bridge: three artifacts (STATUS_NOW, DECISIONS_LOG, briefs) that the human owns and that all three actors read.</desc>
  <style>
    .t  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 400; }
    .ts { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12px; font-weight: 400; }
    .th { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 500; }
    .arr { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Strategic AI -->
  <rect x="40" y="40" width="200" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="140" y="68" text-anchor="middle" fill="#3C3489">Strategic AI</text>
  <text class="ts" x="140" y="88" text-anchor="middle" fill="#534AB7">Thinks, plans, drafts</text>

  <!-- Implementing AI -->
  <rect x="440" y="40" width="200" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="540" y="68" text-anchor="middle" fill="#085041">Implementing AI</text>
  <text class="ts" x="540" y="88" text-anchor="middle" fill="#0F6E56">Edits files, runs code</text>

  <!-- Human Operator -->
  <rect x="240" y="380" width="200" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="th" x="340" y="408" text-anchor="middle" fill="#633806">Human operator</text>
  <text class="ts" x="340" y="428" text-anchor="middle" fill="#854F0B">Persistent memory</text>

  <!-- No-shared-memory dashed line between the two AIs -->
  <line x1="240" y1="72" x2="440" y2="72" stroke="#888780" stroke-width="1" stroke-dasharray="6 4" fill="none"/>
  <text class="ts" x="340" y="64" text-anchor="middle" fill="#5F5E5A">no shared memory</text>

  <!-- The Bridge -->
  <rect x="240" y="180" width="200" height="160" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="340" y="212" text-anchor="middle" fill="#2C2C2A">The bridge</text>
  <text class="ts" x="340" y="238" text-anchor="middle" fill="#444441">STATUS_NOW</text>
  <text class="ts" x="340" y="258" text-anchor="middle" fill="#444441">DECISIONS_LOG</text>
  <text class="ts" x="340" y="278" text-anchor="middle" fill="#444441">briefs</text>
  <text class="ts" x="340" y="316" text-anchor="middle" fill="#5F5E5A">files the human owns</text>
  <text class="ts" x="340" y="332" text-anchor="middle" fill="#5F5E5A">all actors read</text>

  <!-- Strategic AI <-> Bridge -->
  <line x1="200" y1="104" x2="280" y2="180" class="arr" marker-end="url(#arrow)"/>
  <line x1="280" y1="180" x2="200" y2="104" class="arr" marker-end="url(#arrow)"/>

  <!-- Implementing AI <-> Bridge -->
  <line x1="480" y1="104" x2="400" y2="180" class="arr" marker-end="url(#arrow)"/>
  <line x1="400" y1="180" x2="480" y2="104" class="arr" marker-end="url(#arrow)"/>

  <!-- Human <-> Bridge -->
  <line x1="340" y1="380" x2="340" y2="340" class="arr" marker-end="url(#arrow)"/>
  <line x1="340" y1="340" x2="340" y2="380" class="arr" marker-end="url(#arrow)"/>
</svg>
